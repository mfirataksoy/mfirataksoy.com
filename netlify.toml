[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The 2020 site lives under /classic; keep a short alias too.
[[redirects]]
  from = "/2020"
  to = "/classic/"
  status = 301

[[redirects]]
  from = "/resume.pdf"
  to = "/Mehmet_Firat_Aksoy_Resume.pdf"
  status = 301

# Browsers still ask for /favicon.ico by default.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-32.png"
  status = 200

# The chat widget's inbox is for Fırat only.
[[headers]]
  for = "/inbox/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Other sites load the widget from here; keep updates quick to reach them.
[[headers]]
  for = "/chat/widget.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"
