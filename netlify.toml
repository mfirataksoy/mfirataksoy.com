[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # PostHog project token: a public client key that ends up in the bundle anyway.
  VITE_POSTHOG_PROJECT_TOKEN = "phc_zz3FEQ6NNTeNJcS9WKTRDSnQod3FYjuXsJ7EPd77Cozq"
  VITE_POSTHOG_HOST = "https://us.i.posthog.com"

# The 2020 site lives under /classic; keep a short alias too.
[[redirects]]
  from = "/2020"
  to = "/classic/"
  status = 301

[[redirects]]
  from = "/resume.pdf"
  to = "/Mehmet_Firat_Aksoy_Resume.pdf"
  status = 301

# Browsers still ask for /favicon.ico by default.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-32.png"
  status = 200

# The chat widget's inbox is for Fırat only.
[[headers]]
  for = "/inbox/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Other sites load the widget from here; keep updates quick to reach them.
[[headers]]
  for = "/chat/widget.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"
